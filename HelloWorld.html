
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa de Satisfação</title>
</head>
<body>

    <h1>Pesquisa de Satisfação do Cliente</h1>

    <p>Queremos saber sua opinião sobre nossos alimentos!</p>

    <form>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="comida">Qual alimento você consumiu?</label><br>
        <input type="text" id="comida" name="comida" required>
        <br><br>

        <label>Como você avalia o sabor da comida?</label><br>
        <input type="radio" name="sabor" value="otimo"> Ótimo
        <br>
        <input type="radio" name="sabor" value="bom"> Bom
        <br>
        <input type="radio" name="sabor" value="regular"> Regular
        <br>
        <input type="radio" name="sabor" value="ruim"> Ruim
        <br><br>

        <label>Como você avalia a qualidade dos alimentos?</label><br>
        <select name="qualidade">
            <option value="excelente">Excelente</option>
            <option value="boa">Boa</option>
            <option value="regular">Regular</option>
            <option value="ruim">Ruim</option>
        </select>
        <br><br>

        <label>Como você avalia o atendimento?</label><br>
        <input type="radio" name="atendimento" value="otimo"> Ótimo
        <br>
        <input type="radio" name="atendimento" value="bom"> Bom
        <br>
        <input type="radio" name="atendimento" value="ruim"> Ruim
        <br><br>

        <label>Você recomendaria nossa comida?</label><br>
        <input type="radio" name="recomendacao" value="sim"> Sim
        <br>
        <input type="radio" name="recomendacao" value="nao"> Não
        <br><br>

        <label for="sugestao">Deixe sua sugestão ou comentário:</label><br>
        <textarea id="sugestao" name="sugestao"
                  rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Enviar Avaliação">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
