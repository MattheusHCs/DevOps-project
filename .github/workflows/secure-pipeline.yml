name: Secure Pipeline CI/CD (HTML)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --------
  # SAST 
  # --------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # parte da geração do relatório
      - name: Semgrep scan (relatório)
        run: semgrep scan --config auto --json --output semgrep-report.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

      # VALIDAÇÃO: 
      - name: Semgrep gate (validação)
        run: semgrep scan --config auto --severity ERROR --error

  # ------
  # DAST 
  # --------
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Subir aplicação (servidor HTML)
        run: |
          # cd public
          python3 -m http.server 8080 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080 > /dev/null && break
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-x report_xml.xml"
          fail_action: true                 # VALIDAÇÃO
          allow_issue_writing: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_xml.xml
        
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://seu-site.com'
          upload_artifact: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_scan
          path: report_html.html


  

